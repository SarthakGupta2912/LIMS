environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.nankai.flutter_nearby_connections
        pluginClass: FlutterNearbyConnectionsPlugin
