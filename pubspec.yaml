name: lims
description: "LIMS invoice generator and management system"
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  file_picker: ^13.1.0
  google_fonts: ^8.2.1
  pdf: ^3.13.1
  liquid_glass_widgets: ^1.5.0
  qr_flutter: ^4.1.0
  open_filex: ^4.7.0
  permission_handler: ^11.3.1
  uuid: ^4.6.0
  cryptography: ^2.9.0
  cryptography_flutter: 2.3.4
  archive: ^4.0.9
  flutter_nearby_connections_plus: ^1.2.2
  flutter_local_notifications: ^22.3.1
  mobile_scanner: ^7.4.2
  cupertino_icons: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  clock: ^1.1.2

dependency_overrides:
  flutter_nearby_connections_plus:
    path: third_party/flutter_nearby_connections_plus

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/invoice-manager-playstore-icon-1024.png
    - assets/invoice-manager-logo-wordmark.png
